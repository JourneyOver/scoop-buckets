name: Commented Pull Request
run-name: Verify /verify comment (#${{ github.event.issue.number }})

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pullRequestHandler:
    name: Verify comment (/verify)
    runs-on: windows-latest
    steps:

      - name: Checkout bucket
        uses: actions/checkout@main

      - name: PullRequestHandler
        uses: ScoopInstaller/GithubActions@main
        if: startsWith(github.event.comment.body, '/verify')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "/verify check for #${{ github.event.issue.number }} via ${{ github.event_name }}" >> $env:GITHUB_STEP_SUMMARY
          "Triggered by @${{ github.actor }}" >> $env:GITHUB_STEP_SUMMARY
          "Handler runs only on `/verify` prefix" >> $env:GITHUB_STEP_SUMMARY
