name: Pull Requests
run-name: Handle PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types:
      - opened

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pullRequestHandler:
    name: Handle PR
    runs-on: windows-latest
    steps:

      - name: Checkout bucket
        uses: actions/checkout@v7

      - name: PullRequestHandler
        uses: ScoopInstaller/GithubActions@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_BRANCH: develop
