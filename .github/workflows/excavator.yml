name: Excavator
run-name: Excavate (${{ github.ref_name }})

on:
  workflow_dispatch:
  schedule:
    # run every 3 hours
    - cron: "0 */3 * * *"
      timezone: 'America/Chicago'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:

      - name: Checkout bucket
        uses: actions/checkout@v7

      - name: Excavate
        uses: ScoopInstaller/GithubActions@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_BRANCH: develop
          SKIP_UPDATED: 1
